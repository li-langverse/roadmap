name: Development overview (Pages)

# Retired — GitLab CI publishes to progress.lilangverse.xyz (see homelab-k3s/docs/public-edge-progress-pages.md).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Refresh ecosystem stats
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_OVERVIEW_PAGE }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_OVERVIEW_PAGE }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          LI_VCS_PROVIDER: gitlab
          LI_GITLAB_SCHEME: https
          ECOSYSTEM_STATS_SKIP_CLONE: "1"
        run: |
          chmod +x scripts/compute-ecosystem-stats.py
          python3 scripts/compute-ecosystem-stats.py

      - name: Install build deps
        run: python3 -m pip install markdown

      - name: Generate static site
        run: |
          chmod +x scripts/gen-development-overview.sh
          ./scripts/gen-development-overview.sh

      - name: Verify output
        run: |
          test -f site/development-overview/index.html
          test -f site/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
